version: 1
applications:
  - appRoot: auth-screens
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
      customHeaders:
        - pattern: '**/*'
          headers:
            - key: 'Access-Control-Allow-Origin'
              value: '*'
            - key: 'Access-Control-Allow-Headers'
              value: '*'
            - key: 'Access-Control-Allow-Methods'
              value: 'GET, HEAD, OPTIONS'
